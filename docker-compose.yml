services:
  postgres:
    image: postgres:16.4-alpine
    container_name: concurrentbooking-postgres
    environment:
      POSTGRES_DB: concurrentbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - concurrentbooking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concurrentbooking"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  concurrentbooking-postgres-data:
