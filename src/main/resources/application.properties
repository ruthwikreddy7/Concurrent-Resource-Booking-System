
spring.application.name=concurrent-resource-booking-system
server.port=8086

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/booking_db}
spring.datasource.username=${DB_USERNAME:booking_user}
spring.datasource.password=${DB_PASSWORD:dev_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

# Flyway database migrations
spring.flyway.enabled=true

# Spring Boot Actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus
